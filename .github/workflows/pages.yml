name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar el sitio estatico
        run: |
          sed -i 's|name="app-base" content="/"|name="app-base" content="/tecnico/"|' public/index.html
          sed -i 's|href="/styles.css"|href="/tecnico/styles.css"|' public/index.html
          sed -i 's|src="/app.js"|src="/tecnico/app.js"|' public/index.html
          cp public/index.html public/404.html
          touch public/.nojekyll
      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Desplegar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
